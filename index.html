if(db.page==='settled'&&g){const x=db.lastSettlement;out+='<div class="card"><h2>✓ 핸드 정산 완료</h2>'+(x?'<p>핸드 #'+x.handNo+' · 총 팟 <b>'+F(x.pot)+'</b>칩</p>'+x.pots.map(p=>'<div class="card"><b>'+p.name+' · '+F(p.amount)+'칩</b><p>승리: '+p.winners.map(w=>E(w.name)).join(', ')+'</p></div>').join(''):'<p>정산된 핸드입니다.</p>')+'<button class="wide primary" onclick="newHand();if(db.hand){db.pick=\'hero\';go(\'hole\')}else{alert(\'다음 핸드를 시작할 참가자가 부족합니다.\');render()}">다음 핸드 시작 → 내 핸드 선택</button><button class="wide" onclick="go(\'history\')">이전 핸드 기록 보기</button></div>'}
if(db.page==='history'){out+='<h2>저장된 핸드</h2>'+db.hands.slice(0,100).map(h=>'<div class="card"><b>'+new Date(h.at).toLocaleString('ko-KR')+'</b><p>'+E(h.mode==='ai'?'AI 연습':'실전')+' · 레벨 '+(h.level+1)+' · 팟 '+F(h.pot)+' · 승리 '+E(h.names[h.winner]||h.winner+'번')+'</p><small>행동 '+h.logs.length+'개 · 내 카드 '+h.hero.join(' ')+' · 보드 '+h.board.join(' ')+'</small></div>').join('')}
root.innerHTML=out}
try{render()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>실행 문제 감지</h2><p class="note">'+String(e.message).replace(/[<>]/g,'')+'</p><button onclick="location.reload()">새로고침</button></div>'}
</script></body></html>
