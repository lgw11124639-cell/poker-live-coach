if(db.page==='home'){out+='<div class="card"><h2>실전에서 기록하고, 같은 상대와 연습하기</h2><p class="muted">실전 행동 데이터가 AI 상대의 플레이 성향에 반영됩니다.</p><button class="wide primary" onclick="go(\'setup\')">실전 기록 시작</button><button class="wide" onclick="go(\'players\')">실전 기록 분석</button><button class="wide" onclick="go(\'history\')">저장된 핸드 '+db.hands.length+'개</button></div>'}
if(db.page==='setup'){out+='<div class="card"><h2>실전 기록 설정</h2><div class="grid">'+[['count','참가 인원 (2~10)'],['hero','내 좌석'],['dealer','버튼 좌석'],['stack','첫 바인 스택'],['rebuyStack','리바인 스택'],['levelMinutes','레벨 시간 (분)'],['breakEvery','브레이크 간격 (레벨)'],['breakMinutes','브레이크 시간 (분)']].map(([k,t])=>'<label>'+t+'<input type="number" value="'+db.settings[k]+'" onchange="set(\''+k+'\',this.value)"></label>').join('')+'</div><h3>좌석별 닉네임</h3>'+S().map(i=>'<label>'+i+'번 좌석<input value="'+E(db.names[i]||'')+'" onchange="setPlayerName('+i+',this.value)" placeholder="플레이어 닉네임"></label>').join('')+'<p class="note">블라인드: 기존 24레벨 구조 · 빅블라인드 앤티 · 워싱 적용</p><div class="grid"><button class="primary" onclick="createGame(\'live\')">실전 기록 시작</button><button disabled>AI 토너먼트 · 추후 개발</button></div></div>'}
if(db.page==='hole'&&h){out+='<div class="card"><h2>내 핸드 선택</h2><p>두 장을 선택하면 액션을 시작할 수 있습니다.</p><div>'+h.hero.map(face).join('')+'</div><div class="grid">'+[...suits].map(s=>'<div>'+[...ranks].map(r=>'<button class="cardbtn" onclick="pickCard(&quot;'+r+s+'&quot;)">'+r+suit[s]+'</button>').join('')+'</div>').join('')+'</div><button class="wide primary" '+(h.hero.length!==2?'disabled':'')+' onclick="startActions()">핸드 확정 · 액션 시작</button></div>'}
if(['live','tournament'].includes(db.page)&&g){let [sb,bb]=blinds();out+='<div class="card"><div class="row"><b>레벨 '+(db.level+1)+' · '+F(sb)+' / '+F(bb)+' / '+F(ante())+'</b><b id="clock">'+Math.floor(db.elapsed/60)+':'+String(db.elapsed%60).padStart(2,'0')+'</b></div><small>빅블라인드 앤티 · '+db.settings.levelMinutes+'분 레벨</small><div class="grid"><button onclick="db.paused=!db.paused;save();render()">'+(db.paused?'재개':'일시정지')+'</button><button onclick="changeLevel()">다음 레벨</button></div>'+(db.paused?'<p class="note">브레이크 / 워싱 정지 상태 · 워싱된 칩: '+db.washed.map(F).join(', ')+'</p>':'')+'<button class="wide" '+(db.rebuyClosed||db.level>9?'disabled':'')+' onclick="rebuy()">'+(db.rebuyClosed||db.level>9?'리바인 마감':'＋ 리바인 · 40,000칩 추가')+'</button>'+(db.mode==='ai'?'<div class="wrap">'+CHIPS.map(([v,c])=>'<span class="chip" style="background:'+c+';opacity:'+(db.washed.includes(v)?'.25':'1')+'">'+F(v)+'</span>').join('')+'</div>':'')+'</div>';
if(h){out+='<div class="card"><div class="row"><b>내 핸드</b><button onclick="db.pick=\'hero\';db.cardOpen=!db.cardOpen;render()">'+(h.hero.map(face).join('')||'＋ 카드 선택')+'</button></div><div class="row" style="margin-top:8px"><b>공용 보드</b><button onclick="db.pick=\'board\';db.cardOpen=!db.cardOpen;render()">'+(h.board.map(face).join('')||'＋ 보드 선택')+'</button></div>'+(db.cardOpen?'<div class="card-picker"><div class="wrap"><button onclick="db.pick=\'hero\';render()">내 핸드</button><button onclick="db.pick=\'board\';render()">공용 보드</button><button onclick="db.pick=\'shown\';render()">상대 카드</button><button onclick="db.cardOpen=false;render()">닫기</button></div>'+(db.pick==='shown'?'<label>상대 좌석<select onchange="db.pickSeat=Number(this.value);render()">'+S().filter(i=>i!==db.settings.hero).map(i=>'<option value="'+i+'">'+E(label(i))+'</option>').join('')+'</select></label>':'')+'<div class="grid">'+[...suits].map(s=>'<div>'+[...ranks].map(r=>'<button class="cardbtn" style="color:'+cardColor(s)+'" onclick="pickCard(\''+r+s+'\')">'+r+suit[s]+'</button>').join('')+'</div>').join('')+'</div></div>':'')+'</div>';}
out+='<div class="card"><div class="row"><h3>참가자 · 포지션 · 베팅</h3><button onclick="changeDealer()">D 이동</button></div><div class="grid">'+S().filter(i=>!h||!h.players[i]?.fold).map(i=>'<button class="seat '+(db.selected===i?'selected':'')+'" onclick="db.selected='+i+';render()"><div class="seat-head"><b>'+E(label(i))+(i===db.settings.hero?' (나)':'')+' · '+position(i)+'</b>'+(h?'<span class="action-inline">'+['P','F','T','R'].map((abbr,k)=>{const actions=h.logs.filter(l=>l.seat===i&&l.street===k&&l.type!=='강제 베팅');return '<span class="action-mini"><em>'+abbr+'</em> '+(actions.length?actions.map(l=>shortAction(l)).join('›'):'—')+'</span>'}).join('')+'</span>':'')+'</div><small style="display:block">이번 베팅 '+F(h?.players[i]?.paid||0)+' · 총 '+F(h?.players[i]?.total||0)+'</small><small style="display:block">스택 '+F(g.stacks[i])+(h?.players[i]?.fold?' · 폴드':'')+'</small></button>').join('')+'</div></div>';if(!h)out+='<div class="card"><button class="wide primary" onclick="newHand();db.pick=&quot;hero&quot;;go(&quot;hole&quot;)">다음 핸드 시작</button></div>';
else{let p=h.players[db.selected];out+='<div class="card"><div class="grid"><div class="stat"><small>현재 팟</small><b>'+F(h.pot)+'</b></div><div class="stat"><small>현재 베팅</small><b>'+F(h.target)+'</b></div></div><p>'+['프리플랍','플랍','턴','리버'][h.street]+' · '+E(label(db.selected))+' · 콜 필요 '+F(Math.max(0,h.target-p.paid))+'</p><div class="card"><b>칩으로 베팅 입력 · 추가할 금액 '+F(db.chipEntry||0)+'</b><div class="wrap">'+CHIPS.filter(([v])=>!db.washed.includes(v)).map(([v,c])=>'<button class="chip" style="background:'+c+';color:'+(v===10000?'white':'#111')+';min-width:70px;min-height:48px" onclick="chipAdd('+v+')">'+F(v)+'</button>').join('')+'</div><div class="grid"><button onclick="chipClear()">지우기</button><button class="primary" onclick="chipCommit()">칩 베팅 확정</button></div></div><div class="grid">'+['폴드','체크','콜','올인'].map(a=>'<button '+(p.fold||p.allin?'disabled':'')+' onclick="act('+db.selected+',\''+a+'\',0)">'+a+'</button>').join('')+'</div><div class="grid"><button onclick="street()">다음 단계</button><button onclick="finish()">핸드 종료 · 팟 정산</button></div>'+(db.mode==='ai'?'<button class="wide primary" onclick="aiAct()">AI 상대 행동 진행</button>':'')+'</div>';
}
}
if(db.page==='players'){let ps=profiles();out+='<h2>플레이어 장점 · 단점</h2>'+Object.entries(ps).map(([nick,z])=>{let [type,good,bad]=tendency(z);return '<div class="card"><h3>'+E(nick)+'</h3><p>'+E(type)+'</p><small>기록 '+z.hands+'핸드 · 참여 '+Math.round(z.join/z.hands*100)+'% · 레이즈 '+Math.round(z.raise/z.hands*100)+'%</small><p>👍 장점: '+E(good)+'</p><p>⚠️ 주의할 점: '+E(bad)+'</p></div>'}).join('')+'<p class="note">10핸드 미만은 분석을 보류하며 공개되지 않은 상대 카드나 블러프는 추측하지 않습니다.</p>'}
if(db.page==='history'){out+='<h2>저장된 핸드</h2>'+db.hands.slice(0,100).map(h=>'<div class="card"><b>'+new Date(h.at).toLocaleString('ko-KR')+'</b><p>'+E(h.mode==='ai'?'AI 연습':'실전')+' · 레벨 '+(h.level+1)+' · 팟 '+F(h.pot)+' · 승리 '+E(h.names[h.winner]||h.winner+'번')+'</p><small>행동 '+h.logs.length+'개 · 내 카드 '+h.hero.join(' ')+' · 보드 '+h.board.join(' ')+'</small></div>').join('')}
root.innerHTML=out}
try{render()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>실행 문제 감지</h2><p class="note">'+String(e.message).replace(/[<>]/g,'')+'</p><button onclick="location.reload()">새로고침</button></div>'}
</script></body></html>
