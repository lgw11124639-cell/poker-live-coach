<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e1a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>POKER LIVE COACH · NEW</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:#090e1a;color:#f3f5fb}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:20px 14px 100px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}h1{font-size:21px;margin:0;color:#e9be74}h2{font-size:18px}h3{font-size:15px;margin:10px 0}small,.muted{color:#a9b5c9}small{font-size:12px}.card{background:#172237;border:1px solid #2b3b55;border-radius:16px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{display:flex;flex-wrap:wrap;gap:6px}button,input,select{font:inherit;border-radius:10px;padding:11px;border:1px solid #3a4a63;background:#23324a;color:white;min-width:0}button{font-weight:700;cursor:pointer}button:disabled{opacity:.3}button.primary{background:#c9a15c;color:#111827;border:0}button.wide{width:100%;margin-top:10px}input,select{width:100%;background:#0c1627}label{display:block;font-size:12px;color:#c1ccdd;margin:6px 0}label input,label select{margin-top:5px}.stat{background:#0c1627;border-radius:12px;padding:12px}.stat b{display:block;font-size:21px;margin-top:5px}.seat{padding:10px;text-align:left;min-height:76px}.selected{border:2px solid #e8bd72}.chip{border-radius:50%;width:52px;height:52px;display:inline-flex;align-items:center;justify-content:center;border:3px dashed #fff6;font-size:10px;font-weight:900}.log{font-size:13px;padding:7px 0;border-bottom:1px solid #ffffff12}.cardbtn{width:42px;padding:9px 2px;background:white;color:#152032}.red{color:#b81c3b}.tabs button{flex:1}.note{font-size:12px;line-height:1.6;color:#b8c6db}
</style></head><body><main id="app"></main><script>
'use strict';
const KEY='plc_rebuild_v1',LEVELS=[[100,200],[200,400],[300,600],[400,800],[500,1000],[600,1200],[800,1600],[1000,2000],[1500,3000],[2000,4000],[3000,6000],[4000,8000],[5000,10000],[6000,12000],[7000,14000],[8000,16000],[9000,18000],[10000,20000],[15000,30000],[20000,40000],[25000,50000],[30000,60000],[35000,70000],[40000,80000]];
const CHIPS=[[100,'#e2ba2e'],[500,'#ec79b0'],[1000,'#258e4e'],[5000,'#ec8427'],[10000,'#26272b'],[25000,'#266bcc'],[50000,'#cc333f']];
const initial=()=>({page:'home',mode:'live',settings:{count:8,hero:1,dealer:8,stack:30000,rebuyStack:40000,levelMinutes:15,breakEvery:4,breakMinutes:10},names:{},profiles:{},hands:[],game:null,hand:null,selected:1,pick:'hero',pickSeat:2,washed:[],level:0,elapsed:0,paused:false,breakLeft:0,rebuyClosed:false,notes:''});
let db;try{db={...initial(),...JSON.parse(localStorage.getItem(KEY)||'null')}}catch(e){db=initial()}
const F=n=>Number(n||0).toLocaleString('ko-KR'),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])),N=i=>db.names[i]||i+'번 좌석',S=()=>Array.from({length:db.settings.count},(_,i)=>i+1),next=i=>i%db.settings.count+1,blinds=()=>LEVELS[Math.min(db.level,LEVELS.length-1)],ante=()=>blinds()[1],save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('저장 공간이 부족합니다.')}},go=p=>{db.page=p;save();render()},set=(k,v)=>{let n=Math.floor(Number(v));if(!Number.isFinite(n))return;db.settings[k]=Math.max(k==='count'?2:k==='levelMinutes'?1:0,n);if(k==='count')db.settings.count=Math.min(10,db.settings.count);db.settings.hero=Math.min(db.settings.hero,db.settings.count);db.settings.dealer=Math.min(db.settings.dealer,db.settings.count);save();render()},name=(i,v)=>{v=v.trim().slice(0,25);if(v&&Object.entries(db.names).some(([k,x])=>Number(k)!==i&&x===v)){alert('중복 닉네임은 사용할 수 없습니다.');render();return}db.names[i]=v;save()},num=(id)=>Math.max(0,Math.floor(Number(document.getElementById(id)?.value)||0));
const label=i=>db.mode==='ai'&&db.game?.names?.[i]?db.game.names[i]:N(i);
function profiles(){let r={};for(const h of db.hands){if(h.mode!=='live')continue;for(const i of Object.keys(h.players)){const nick=h.names[i]||i+'번 좌석',z=r[nick]??={hands:0,join:0,raise:0,call:0,fold:0,bet:0,show:0};z.hands++;const l=h.logs.filter(a=>a.seat==i&&a.type!=='강제 베팅');if(l.some(a=>a.street===0&&['콜','베팅','레이즈','올인'].includes(a.type)))z.join++;if(l.some(a=>a.street===0&&['베팅','레이즈'].includes(a.type)))z.raise++;for(const a of l){if(a.type==='콜')z.call++;if(a.type==='폴드')z.fold++;if(['베팅','레이즈'].includes(a.type))z.bet++}if(h.shown[i]?.length)z.show++}}return r}
function tendency(z){if(!z||z.hands<10)return ['분석 중','관찰 기록이 더 필요합니다.','아직 단점을 판단하기 어렵습니다.'];const join=z.join/z.hands,raise=z.raise/z.hands;return [join>.4?(raise>.18?'자주 참여하고 공격적':'콜을 자주 하는 유형'):(raise>.14?'신중하고 공격적':'신중하고 소극적'),raise>.14?'상대에게 압박을 줄 수 있음':join<.3?'핸드를 신중하게 선택함':'다양한 핸드로 참여함',z.call>z.bet*2?'콜이 많아 주도권을 잃을 수 있음':join>.5?'너무 많은 핸드에 참여할 수 있음':'특정 상황의 약점은 추가 관찰 필요']}
function createGame(mode){db.mode=mode;db.level=0;db.elapsed=0;db.paused=false;db.rebuyClosed=false;db.washed=[];db.game={mode,names:{...db.names},stacks:{},dealer:db.settings.dealer,handNo:0};for(const i of S())db.game.stacks[i]=db.settings.stack;if(mode==='ai'){let pool=Object.entries(profiles()).filter(([n])=>n!=='나'&&n!==N(db.settings.hero)).sort((a,b)=>b[1].hands-a[1].hands).map(x=>x[0]);for(const i of S())if(i!==db.settings.hero)db.game.names[i]=pool.shift()||'연습 AI '+i}newHand();go(mode==='ai'?'tournament':'live')}
function newHand(){let g=db.game;if(!g)return;g.handNo++;let h={mode:db.mode,id:Date.now(),at:new Date().toISOString(),level:db.level,street:0,pot:0,target:0,players:{},logs:[],hero:[],board:[],shown:{},names:{...g.names},dealer:g.dealer};for(const i of S())h.players[i]={paid:0,total:0,fold:g.stacks[i]<=0,allin:false};const active=S().filter(i=>g.stacks[i]>0);if(active.length<2){db.hand=null;save();return}let sb=next(g.dealer);while(g.stacks[sb]<=0)sb=next(sb);let bb=next(sb);while(g.stacks[bb]<=0)bb=next(bb);const [s,b]=blinds();for(const [i,amt] of [[sb,s],[bb,b],[bb,ante()]]){const paid=Math.min(g.stacks[i],amt);g.stacks[i]-=paid;h.players[i].paid+=(i===bb&&amt===ante()?0:paid);h.players[i].total+=paid;h.pot+=paid;h.logs.push({street:0,seat:i,type:'강제 베팅',amount:paid});if(g.stacks[i]===0)h.players[i].allin=true}h.target=Math.max(...S().map(i=>h.players[i].paid));db.hand=h;save()}
function act(i,type,amount){let h=db.hand,p=h?.players[i],g=db.game;if(!p||p.fold||p.allin)return;let need=Math.max(0,h.target-p.paid),add=0;if(type==='콜')add=Math.min(need,g.stacks[i]);if(['베팅','레이즈','올인'].includes(type)){let goal=type==='올인'?p.paid+g.stacks[i]:amount;if(goal<=p.paid||goal<=h.target&&type!=='올인'){alert('현재 베팅보다 큰 누적 베팅 금액을 입력하세요.');return}add=Math.min(g.stacks[i],goal-p.paid)}if(type==='체크'&&need){alert('콜하거나 폴드해야 합니다.');return}if(type==='폴드')p.fold=true;g.stacks[i]-=add;p.paid+=add;p.total+=add;h.pot+=add;if(g.stacks[i]===0)p.allin=true;if(p.paid>h.target)h.target=p.paid;h.logs.push({street:h.street,seat:i,type,amount:add,paid:p.paid});save();render()}
function street(){let h=db.hand;if(!h||h.street>=3)return;h.street++;h.target=0;for(const p of Object.values(h.players))p.paid=0;h.logs.push({street:h.street,type:'다음 단계',amount:0});save();render()}
function finish(){let h=db.hand,g=db.game;if(!h)return;let winner=Number(prompt('팟을 가져간 좌석 번호 (여러 명 분할 팟은 추후 지원)',String(db.settings.hero)));if(!h.players[winner])return;g.stacks[winner]+=h.pot;h.winner=winner;h.ended=new Date().toISOString();db.hands.unshift(h);g.dealer=next(g.dealer);db.hand=null;save();render()}
function aiAct(){let h=db.hand;if(!h)return;const st=profiles();for(const i of S()){if(i===db.settings.hero)continue;let p=h.players[i];if(p.fold||p.allin)continue;const z=st[label(i)],r=Math.random(),need=Math.max(0,h.target-p.paid),ag=z&&z.hands>=10?Math.min(.45,.07+z.raise/z.hands):.16,join=z&&z.hands>=10?Math.min(.9,z.join/z.hands):.35;if(need>0&&r>join){act(i,'폴드',0)}else if(r<ag&&db.game.stacks[i]>need+blinds()[1]){act(i,'레이즈',h.target+blinds()[1]*2)}else act(i,need?'콜':'체크',0)}}
function rebuy(){if(!db.game)return;if(db.rebuyClosed||db.level>9){alert('리바인 마감: 2,000/4,000 레벨 종료 후 브레이크까지입니다.');return}let seat=Number(prompt('리바인할 좌석 번호 (1~'+db.settings.count+')',String(db.selected)));if(!S().includes(seat))return;const amt=Number(db.settings.rebuyStack||40000);if(db.hand&&db.hand.players[seat]&&!db.hand.players[seat].fold&&!db.hand.players[seat].allin){alert('진행 중인 핸드에 참여한 플레이어는 핸드 종료 후 리바인할 수 있습니다.');return}if(!confirm(label(seat)+' · 리바인 '+F(amt)+'칩을 추가할까요?'))return;db.game.stacks[seat]=(db.game.stacks[seat]||0)+amt;db.game.rebuys??=[];db.game.rebuys.push({seat,amount:amt,at:new Date().toISOString(),handNo:db.game.handNo});if(db.hand&&db.hand.players[seat]){db.hand.players[seat].fold=true;db.hand.logs.push({street:db.hand.street,seat,type:'리바인 대기',amount:amt})}save();render()}
function changeLevel(){if(db.level===9){db.rebuyClosed=true;db.paused=true;db.breakLeft=db.settings.breakMinutes*60}db.level=Math.min(db.level+1,LEVELS.length-1);if(db.settings.breakEvery>0&&db.level%db.settings.breakEvery===0){db.paused=true;db.breakLeft=db.settings.breakMinutes*60}const wash=db.level===5?100:db.level===10?500:db.level===18?1000:db.level===24?5000:0;if(wash&&!db.washed.includes(wash)){db.washed.push(wash);db.paused=true}save();render()}
function tick(){if(!db.game||db.page!=='tournament'&&db.page!=='live'||db.paused)return;db.elapsed++;if(db.elapsed>=db.settings.levelMinutes*60){db.elapsed=0;changeLevel()}else if(db.elapsed%10===0)save();let t=document.getElementById('clock');if(t)t.textContent=F(Math.floor(db.elapsed/60))+':'+String(db.elapsed%60).padStart(2,'0')}
setInterval(tick,1000);
const ranks='AKQJT98765432',suits='SHDC',suit={S:'♠',H:'♥',D:'♦',C:'♣'};
function pickCard(c){let h=db.hand;if(!h)return;let arr=db.pick==='hero'?h.hero:db.pick==='board'?h.board:(h.shown[db.pickSeat]??=[]),all=[...h.hero,...h.board,...Object.values(h.shown).flat()];if(arr.includes(c))arr.splice(arr.indexOf(c),1);else if(!all.includes(c)&&arr.length<(db.pick==='board'?5:2))arr.push(c);save();render()}
const face=c=>'<b style="display:inline-block;padding:7px;background:white;color:'+(/[HD]/.test(c[1])?'#b81c3b':'#172237')+';border-radius:7px;margin:2px">'+c[0]+suit[c[1]]+'</b>';
function render(){if(!db.settings.rebuyStack)db.settings.rebuyStack=40000;const root=document.getElementById('app'),h=db.hand,g=db.game;let out='<header><h1>♠ POKER LIVE COACH</h1><button onclick="go(\'home\')">홈</button></header>';
if(db.page==='home'){out+='<div class="card"><h2>실전에서 기록하고, 같은 상대와 연습하기</h2><p class="muted">실전 행동 데이터가 AI 상대의 플레이 성향에 반영됩니다.</p><button class="wide primary" onclick="go(\'setup\')">새 토너먼트 / 실전 시작</button><button class="wide" onclick="go(\'players\')">플레이어 성향 · 장단점</button><button class="wide" onclick="go(\'history\')">저장된 핸드 '+db.hands.length+'개</button></div>'}
if(db.page==='setup'){out+='<div class="card"><h2>토너먼트 설정</h2><div class="grid">'+[['count','참가 인원 (2~10)'],['hero','내 좌석'],['dealer','버튼 좌석'],['stack','첫 바인 스택'],['rebuyStack','리바인 스택'],['levelMinutes','레벨 시간 (분)'],['breakEvery','브레이크 간격 (레벨)'],['breakMinutes','브레이크 시간 (분)']].map(([k,t])=>'<label>'+t+'<input type="number" value="'+db.settings[k]+'" onchange="set(\''+k+'\',this.value)"></label>').join('')+'</div><h3>좌석별 닉네임</h3>'+S().map(i=>'<label>'+i+'번 좌석<input value="'+E(db.names[i]||'')+'" onchange="name('+i+',this.value)" placeholder="플레이어 닉네임"></label>').join('')+'<p class="note">블라인드: 기존 24레벨 구조 · 빅블라인드 앤티 · 워싱 적용</p><div class="grid"><button class="primary" onclick="createGame(\'live\')">실전 기록 시작</button><button class="primary" onclick="createGame(\'ai\')">AI 토너먼트 시작</button></div></div>'}
if(['live','tournament'].includes(db.page)&&g){let [sb,bb]=blinds();out+='<div class="card"><div class="row"><b>레벨 '+(db.level+1)+' · '+F(sb)+' / '+F(bb)+' / '+F(ante())+'</b><b id="clock">'+Math.floor(db.elapsed/60)+':'+String(db.elapsed%60).padStart(2,'0')+'</b></div><small>빅블라인드 앤티 · '+db.settings.levelMinutes+'분 레벨</small><div class="grid"><button onclick="db.paused=!db.paused;save();render()">'+(db.paused?'재개':'일시정지')+'</button><button onclick="changeLevel()">다음 레벨</button></div>'+(db.paused?'<p class="note">브레이크 / 워싱 정지 상태 · 워싱된 칩: '+db.washed.map(F).join(', ')+'</p>':'')+'<button class="wide" '+(db.rebuyClosed||db.level>9?'disabled':'')+' onclick="rebuy()">'+(db.rebuyClosed||db.level>9?'리바인 마감':'＋ 리바인 · 40,000칩 추가')+'</button>'<div class="wrap">'+CHIPS.map(([v,c])=>'<span class="chip" style="background:'+c+';opacity:'+(db.washed.includes(v)?'.25':'1')+'">'+F(v)+'</span>').join('')+'</div></div>';
out+='<div class="card"><div class="grid">'+S().map(i=>'<button class="seat '+(db.selected===i?'selected':'')+'" onclick="db.selected='+i+';render()"><b>'+E(label(i))+(i===db.settings.hero?' (나)':'')+'</b><small style="display:block">스택 '+F(g.stacks[i])+(h?.players[i]?.fold?' · 폴드':'')+'</small></button>').join('')+'</div></div>';
if(!h)out+='<div class="card"><button class="wide primary" onclick="newHand();render()">다음 핸드 시작</button></div>';
else{let p=h.players[db.selected];out+='<div class="card"><div class="grid"><div class="stat"><small>현재 팟</small><b>'+F(h.pot)+'</b></div><div class="stat"><small>현재 베팅</small><b>'+F(h.target)+'</b></div></div><p>'+['프리플랍','플랍','턴','리버'][h.street]+' · '+E(label(db.selected))+' · 콜 필요 '+F(Math.max(0,h.target-p.paid))+'</p><label>레이즈 후 총 베팅 금액<input id="bet" type="number" inputmode="numeric" value="'+(h.target+bb*2)+'"></label><div class="grid">'+['폴드','체크','콜','베팅','레이즈','올인'].map(a=>'<button '+(p.fold||p.allin?'disabled':'')+' onclick="act('+db.selected+',\''+a+'\',num(\'bet\'))">'+a+'</button>').join('')+'</div><div class="grid"><button onclick="street()">다음 단계</button><button onclick="finish()">핸드 종료 · 팟 정산</button></div>'+(db.mode==='ai'?'<button class="wide primary" onclick="aiAct()">AI 상대 행동 진행</button>':'')+'</div>';
out+='<div class="card"><h3>카드 기록</h3><div class="wrap"><button onclick="db.pick=\'hero\';render()">내 카드</button><button onclick="db.pick=\'board\';render()">공용 카드</button><button onclick="db.pick=\'shown\';render()">상대 공개 카드</button></div>'+(db.pick==='shown'?'<label>상대 좌석<select onchange="db.pickSeat=Number(this.value);render()">'+S().filter(i=>i!==db.settings.hero).map(i=>'<option value="'+i+'" '+(db.pickSeat===i?'selected':'')+'>'+E(label(i))+'</option>').join('')+'</select></label>':'')+'<p>내 카드 '+h.hero.map(face).join('')+' / 보드 '+h.board.map(face).join('')+'</p><p>상대 공개 '+(h.shown[db.pickSeat]||[]).map(face).join('')+'</p><div class="grid">'+[...suits].map(s=>'<div>'+[...ranks].map(r=>'<button class="cardbtn '+(/[HD]/.test(s)?'red':'')+'" onclick="pickCard(\''+r+s+'\')">'+r+suit[s]+'</button>').join('')+'</div>').join('')+'</div></div>';
out+='<div class="card"><h3>행동 기록</h3>'+h.logs.slice(-20).map(l=>'<div class="log">'+['프리플랍','플랍','턴','리버'][l.street]+' · '+(l.seat?E(label(l.seat))+' · ':'')+l.type+(l.amount?' '+F(l.amount):'')+'</div>').join('')+'</div>'}
}
if(db.page==='players'){let ps=profiles();out+='<h2>플레이어 장점 · 단점</h2>'+Object.entries(ps).map(([nick,z])=>{let [type,good,bad]=tendency(z);return '<div class="card"><h3>'+E(nick)+'</h3><p>'+E(type)+'</p><small>기록 '+z.hands+'핸드 · 참여 '+Math.round(z.join/z.hands*100)+'% · 레이즈 '+Math.round(z.raise/z.hands*100)+'%</small><p>👍 장점: '+E(good)+'</p><p>⚠️ 주의할 점: '+E(bad)+'</p></div>'}).join('')+'<p class="note">10핸드 미만은 분석을 보류하며 공개되지 않은 상대 카드나 블러프는 추측하지 않습니다.</p>'}
if(db.page==='history'){out+='<h2>저장된 핸드</h2>'+db.hands.slice(0,100).map(h=>'<div class="card"><b>'+new Date(h.at).toLocaleString('ko-KR')+'</b><p>'+E(h.mode==='ai'?'AI 연습':'실전')+' · 레벨 '+(h.level+1)+' · 팟 '+F(h.pot)+' · 승리 '+E(h.names[h.winner]||h.winner+'번')+'</p><small>행동 '+h.logs.length+'개 · 내 카드 '+h.hero.join(' ')+' · 보드 '+h.board.join(' ')+'</small></div>').join('')}
root.innerHTML=out}

</script></body></html>
