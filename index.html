const KEY='plc_safari_v1';const DENOMS=[{v:100,c:'#EBCF33',t:'#171717'},{v:500,c:'#E88DB8',t:'#171717'},{v:1000,c:'#258E4E',t:'#fff'},{v:5000,c:'#EC8427',t:'#fff'},{v:10000,c:'#26272B',t:'#fff'},{v:25000,c:'#266BCC',t:'#fff'},{v:50000,c:'#CC333F',t:'#fff'}];

let state=initial();try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.screen)state={...state,...s}}catch(_){};const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(_){}};const active=()=>state.players.filter(p=>!p.folded&&p.stack>=0);const getSeat=n=>state.players.find(p=>p.seat===n);const nextOccupied=(seat,players=state.players)=>{for(let i=1;i<=10;i++){const n=(seat+i-1)%10+1;if(players.some(p=>p.seat===n&&p.stack>0))return n}return seat};
function role(seat){
 const inHand=state.players.filter(p=>!p.folded||p.contributed>0||p.stack>0).filter(p=>p.handDealt!==false);
 const seats=state.handPositionSeats?.length?state.handPositionSeats:inHand.map(p=>p.seat);
 const order=seats.slice().sort((a,b)=>a-b);
 if(order.length<2||!order.includes(seat))return '';
 const after=n=>{const i=order.findIndex(x=>x>n);return order[i<0?0:i]};
 const btn=order.includes(state.handPositionButton)?state.handPositionButton:state.button;
 const sb=order.length===2?btn:after(btn),bb=after(sb);
 if(seat===btn)return 'BTN';
 if(seat===sb)return 'SB';
 if(seat===bb)return 'BB';
 const remaining=[];let pos=after(bb);while(pos!==btn&&remaining.length<order.length){remaining.push(pos);pos=after(pos)}
 const names=remaining.length===1?['CO']:remaining.length===2?['UTG','CO']:remaining.length===3?['UTG','HJ','CO']:remaining.length===4?['UTG','MP','HJ','CO']:remaining.length===5?['UTG','UTG+1','MP','HJ','CO']:remaining.length===6?['UTG','UTG+1','MP','LJ','HJ','CO']:['UTG','UTG+1','UTG+2','MP','LJ','HJ','CO'];
 return names[remaining.indexOf(seat)]||''
}
function setBlindLevel(n){state.level=n;const a=LEVELS[n-1];if(a){state.sb=a[0];state.bb=a[1]}state.levelEndsAt=Date.now()+1200000;state.levelTimeExpired=false;state.pendingLevel=0}

function clockTick(){if(state.screen!=='game'||state.paused||state.gameType!=='새틀라이트'||!state.players.length)return;const sec=Math.max(0,Math.ceil((state.levelEndsAt-Date.now())/1000));const el=document.getElementById('timer-live');if(el)el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec===0&&!state.levelTimeExpired){state.levelTimeExpired=true;state.history.unshift('레벨 시간 종료 · 수동 블라인드 업 대기');render()}}setInterval(clockTick,1000);
function prepareHand(first=false){const live=state.players.filter(p=>p.stack>0);if(live.length<2){state.paused='인원 부족';return}if(!first)state.button=nextOccupied(state.button,live);const sbSeat=nextOccupied(state.button,live),bbSeat=nextOccupied(sbSeat,live);state.players=state.players.map(p=>({...p,folded:p.stack<=0,roundPaid:0,contributed:0}));state.currentBet=0;state.lastRaise=Number(state.bb)||200;let posted=0;for(const [seat,amt] of [[sbSeat,state.sb],[bbSeat,state.bb],...(state.gameType==='새틀라이트'&&state.level>=3?[[bbSeat,state.bb]]:[])]){const p=getSeat(seat);if(p){const a=Math.min(p.stack,amt);p.stack-=a;posted+=a;p.contributed+=a;if(seat===sbSeat||seat===bbSeat)p.roundPaid+=a}}state.currentBet=Math.min(state.bb,getSeat(bbSeat)?.roundPaid||0);state.pot=posted;state.amount=0;state.street='PREFLOP';state.cards={hero:[],board:[]};state.selected=nextOccupied(bbSeat,live);state.history.unshift('#'+state.hand+' 시작 · 블라인드 '+F(state.sb)+'/'+F(state.bb));}
function makeGame(){const seatCount=Math.min(10,Math.max(2,Number(state.seats)||9)), stack=Math.max(1,Number(state.starting)||30000)+(state.earlyEnabled?Number(state.early)||0:0);state.seats=seatCount;state.registrationOpen=true;state.pendingLevel=0;state.washTarget=[];if(state.gameType==='새틀라이트')setBlindLevel(1);const occupied=(state.occupiedSeats||[]).slice(0,10);const chairs=occupied.length>=2?occupied:Array.from({length:seatCount},(_,i)=>i+1);state.seats=chairs.length;state.players=chairs.map(seat=>({seat,stack,folded:false,played:0,raises:0,calls:0,folds:0,revealed:[]}));state.button=chairs[chairs.length-1];state.heroSeat=0;state.hand=1;if(state.joinMid&&state.gameType==='새틀라이트'){const lev=Math.max(1,Math.min(LEVELS.length,Number(state.joinLevel)||1));setBlindLevel(lev);state.levelEndsAt=Date.now()+Math.max(1,Math.min(20,Number(state.joinMinutes)||20))*60000;state.registrationOpen=lev<=10;state.wash=lev>18?[100,500,1000]:lev>10?[100,500]:[];state.heroSeat=chairs.includes(Number(state.joinHeroSeat))?Number(state.joinHeroSeat):chairs[0];const me=state.players.find(p=>p.seat===state.heroSeat);if(me)me.stack=Math.max(1,Number(state.joinHeroStack)||30000);state.button=chairs.includes(Number(state.joinButtonSeat))?Number(state.joinButtonSeat):chairs[chairs.length-1];state.history.unshift('진행 중인 새틀라이트 레벨 '+lev+'부터 기록 시작 · 이전 핸드 기록 없음')}state.history=state.joinMid?state.history:[];state.wash=state.joinMid?state.wash:[];state.breakQueued=false;state.washQueued=false;state.paused='';prepareHand(true);state.screen='game';render()}
function finish(winner){const p=getSeat(winner);if(!p)return;const award=state.pot;p.stack+=award;state.history.unshift('#'+state.hand+' '+winner+'번 승리 +'+F(award)+'칩');state.games.unshift({at:new Date().toLocaleString('ko-KR'),hand:state.hand,winner,pot:award,mode:state.mode,blind:state.sb+'/'+state.bb});state.games=state.games.slice(0,100);state.pot=0;if(state.gameType==='새틀라이트'&&state.pendingLevel===11){state.paused='break';state.registrationOpen=false;state.washTarget=[100,500];state.washQueued=true;state.breakQueued=false}else if(state.gameType==='새틀라이트'&&state.pendingLevel===19){state.paused='break';state.washQueued=true;state.washTarget=[1000];state.history.unshift('18레벨 10,000/20,000 종료 · 브레이크 + 1,000칩 워싱')}else if(state.gameType==='새틀라이트'&&state.pendingLevel===25){state.paused='break';state.washQueued=true;state.washTarget=[5000];state.history.unshift('24레벨 40,000/80,000 종료 · 브레이크 + 5,000칩 워싱')}else if(state.breakQueued){state.paused='break';state.breakQueued=false}else if(state.washQueued){state.paused='wash';state.washQueued=false}else{applyPending();state.hand++;prepareHand()}render()}

function quickOpponentRead(p,actions){
 const raises=Number(p?.raises)||0,calls=Number(p?.calls)||0,folds=Number(p?.folds)||0;

 const aggression=(raises+prior)/(calls+prior);
 let tendency=n===0?'미확인 · 포지션 기준':aggression>1.35?'공격적 잠정':aggression<.7?'콜 중심 잠정':'균형형 잠정';
 if(n===0&&recentRaise)tendency='공격적 행동 관찰';else if(n===0&&recentCall)tendency='콜 성향 관찰';else if(n===0&&recentFold)tendency='폴드 행동 관찰';

 return {n,aggression,tendency,confidence,adjust:n?Math.min(1,n/5):0};
}

<script>
/* Independent local-only 9-seat playable tournament V57. */
(function(){
const KEY='plc_playable_v57', ranks='23456789TJQKA', suits='SHDC';
let G=null;
const $=()=>document.getElementById('playable-root');
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const card=c=>c?c[0]+({S:'♠',H:'♥',D:'♦',C:'♣'}[c[1]]||''):'🂠';
const color=c=>c&&/[HD]/.test(c[1])?'#e55570':'#202938';
const random=()=>{if(typeof crypto!=='undefined'&&crypto.getRandomValues){let b=new Uint32Array(1);crypto.getRandomValues(b);return b[0]/4294967296}return Math.random()};
const deck=()=>{let a=[];for(let r of ranks)for(let t of suits)a.push(r+t);for(let i=a.length-1;i>0;i--){let j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const seatAfter=(n,arr)=>{for(let k=1;k<=9;k++){let x=(n-1+k)%9+1;if(arr.includes(x))return x}return n};
const live=()=>G.p.filter(x=>x.stack>0||x.invest>0).map(x=>x.seat);
const active=()=>G.p.filter(x=>!x.fold&&(!x.out)&& (x.stack>0||x.invest>0));
const pl=n=>G.p[n-1];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){console.warn(e)}};
const hand5=cs=>{let v=cs.map(c=>ranks.indexOf(c[0])+2).sort((a,b)=>b-a), cnt={};v.forEach(n=>cnt[n]=(cnt[n]||0)+1);let gr=Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a]||b-a);let fl=cs.every(c=>c[1]===cs[0][1]),uniq=[...new Set(v)];if(uniq.includes(14))uniq.push(1);let st=0;for(let i=0;i<=uniq.length-5;i++)if(uniq[i]-uniq[i+4]===4){st=uniq[i];break}if(st&&fl)return[8,st];if(cnt[gr[0]]===4)return[7,gr[0],...v.filter(n=>n!==gr[0])];if(cnt[gr[0]]===3&&cnt[gr[1]]>=2)return[6,gr[0],gr[1]];if(fl)return[5,...v];if(st)return[4,st];if(cnt[gr[0]]===3)return[3,gr[0],...v.filter(n=>n!==gr[0])];if(cnt[gr[0]]===2&&cnt[gr[1]]===2)return[2,gr[0],gr[1],...v.filter(n=>n!==gr[0]&&n!==gr[1])];if(cnt[gr[0]]===2)return[1,gr[0],...v.filter(n=>n!==gr[0])];return[0,...v]};
const cmp=(a,b)=>{for(let i=0;i<Math.max(a.length,b.length);i++){let d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};
const score=cs=>{let best=null;for(let a=0;a<7;a++)for(let b=a+1;b<7;b++){let z=hand5(cs.filter((_,i)=>i!==a&&i!==b));if(!best||cmp(z,best)>0)best=z}return best};
const put=(p,n)=>{let a=Math.min(p.stack,Math.max(0,n));p.stack-=a;p.paid+=a;p.invest+=a;G.pot+=a;return a};
const log=t=>{G.log.unshift(t);G.log=G.log.slice(0,30)};
const profiles=[{name:'타이트',tight:.83,aggr:.38,bluff:.08},{name:'루즈패시브',tight:.30,aggr:.14,bluff:.07},{name:'루즈어그레시브',tight:.24,aggr:.77,bluff:.31},{name:'콜링스테이션',tight:.16,aggr:.08,bluff:.03},{name:'TAG',tight:.68,aggr:.66,bluff:.13},{name:'매니악',tight:.08,aggr:.92,bluff:.48},{name:'니트',tight:.95,aggr:.16,bluff:.02},{name:'밸런스형',tight:.53,aggr:.49,bluff:.15}];
function start(seat){let mixed=profiles.slice();for(let i=mixed.length-1;i>0;i--){let j=Math.floor(random()*(i+1));[mixed[i],mixed[j]]=[mixed[j],mixed[i]]}let k=0;G={hero:seat,p:Array.from({length:9},(_,i)=>({seat:i+1,stack:30000,out:false,profile:i+1===seat?null:{...mixed[k++]}})),hand:0,button:9,level:1,sb:100,bb:200,pot:0,board:[],log:[],phase:'between'};nextHand()}
function nextHand(){
 if(!G)return;const survivors=G.p.filter(p=>p.stack>0).map(p=>p.seat);
 if(survivors.length<2){G.phase='finished';save();render();return}
 G.hand++;if(G.hand>1)G.button=seatAfter(G.button,survivors);
 G.level=1+Math.floor((G.hand-1)/10);const blinds=[[100,200],[200,400],[300,600],[400,800],[500,1000],[600,1200],[800,1600],[1000,2000],[1500,3000],[2000,4000],[3000,6000]];
 [G.sb,G.bb]=blinds[Math.min(G.level-1,blinds.length-1)];
 G.deck=deck();G.board=[];G.pot=0;G.bet=G.bb;G.minRaise=G.bb;G.street='PREFLOP';G.phase='play';G.log=[];G.actionLog=[];G.reveal=false;
 for(let p of G.p){p.out=p.stack<=0;p.fold=p.out;p.paid=0;p.invest=0;p.acted=false;p.hole=p.out?[]:[G.deck.pop(),G.deck.pop()]}
 G.sbSeat=survivors.length===2?G.button:seatAfter(G.button,survivors);G.bbSeat=seatAfter(G.sbSeat,survivors);
 put(pl(G.sbSeat),G.sb);put(pl(G.bbSeat),G.bb);
 G.bet=pl(G.bbSeat).paid;G.turn=survivors.length===2?G.sbSeat:seatAfter(G.bbSeat,survivors);
 log('핸드 #'+G.hand+' 시작 · '+G.sb+'/'+G.bb+' · BTN '+G.button+'번');save();render()
}
function nextActor(from){let pool=active().filter(p=>p.stack>0&&(!p.acted||p.paid<G.bet)).map(p=>p.seat);return pool.length?seatAfter(from,pool):null}
function settle(){
 let inPlayers=active();
 if(inPlayers.length===1){let w=inPlayers[0];w.stack+=G.pot;log(w.seat+'번 팟 '+fmt(G.pot)+' 획득');G.pot=0;G.phase='between';G.turn=null;G.bet=0;for(const q of G.p)q.paid=0;save();render();return}
 // Side pots: split by total invested levels, including folded contributors.
 let levels=[...new Set(G.p.filter(p=>p.invest>0).map(p=>p.invest))].sort((a,b)=>a-b),prev=0, awards={};
 for(let level of levels){let contributors=G.p.filter(p=>p.invest>=level),size=(level-prev)*contributors.length;prev=level;if(!size)continue;
 let contenders=inPlayers.filter(p=>p.invest>=level);if(!contenders.length)continue;
 let best=null,winners=[];for(let p of contenders){let v=score([...p.hole,...G.board]);if(!best||cmp(v,best)>0){best=v;winners=[p]}else if(cmp(v,best)===0)winners.push(p)}
 let share=Math.floor(size/winners.length),rem=size%winners.length;
 winners.sort((a,b)=>((a.seat-G.button+9)%9)-((b.seat-G.button+9)%9));
 winners.forEach((p,i)=>{let a=share+(i<rem?1:0);p.stack+=a;awards[p.seat]=(awards[p.seat]||0)+a})
 }
 G.winners=awards;G.reveal=true;log('쇼다운 · '+Object.entries(awards).map(([n,a])=>n+'번 +'+fmt(a)).join(', '));G.pot=0;G.phase='between';G.turn=null;G.bet=0;for(const q of G.p)q.paid=0;save();render()
}
function advance(){
 let remaining=active();if(remaining.length===1){settle();return}
 let pending=remaining.filter(p=>p.stack>0&&(!p.acted||p.paid<G.bet));
 if(remaining.filter(p=>p.stack>0).length===1&&pending.length===1&&pending[0].paid>=G.bet)pending=[];
 if(pending.length){G.turn=seatAfter(G.turn,pending.map(p=>p.seat));save();render();return}
 if(G.street==='RIVER'){settle();return}
 G.street=({PREFLOP:'FLOP',FLOP:'TURN',TURN:'RIVER'})[G.street];
 for(let i=0;i<(G.street==='FLOP'?3:1);i++)G.board.push(G.deck.pop());
 for(let p of G.p){p.paid=0;p.acted=false}
 G.bet=0;G.minRaise=G.bb;
 let able=active().filter(p=>p.stack>0).map(p=>p.seat);
 if(!able.length){if(G.street==='RIVER')settle();else advance();return}
 G.turn=seatAfter(G.button,able);log(G.street+' · '+G.board.map(card).join(' '));save();render()
}
function action(kind,target){
 if(G.phase!=='play')return;let p=pl(G.turn);if(!p||p.fold||p.stack<=0)return;
 let due=Math.max(0,G.bet-p.paid),oldBet=G.bet,amt=0;
 const before=p.paid;
 if(kind==='fold'){p.fold=true;p.acted=true;log(p.seat+'번 폴드')}
 else if(kind==='check'){if(due)return;p.acted=true;log(p.seat+'번 체크')}
 else{
 if(kind==='call')amt=Math.min(due,p.stack);
 else if(kind==='allin')amt=p.stack;
 else if(kind==='raise'){let t=Number(target);if(!Number.isFinite(t)||t<=G.bet||t>p.stack+p.paid||t<G.bet+G.minRaise){alert('최소 총 '+fmt(G.bet+G.minRaise)+'칩, 최대 '+fmt(p.stack+p.paid)+'칩');return}amt=t-p.paid}
 if(amt<=0)return;
 put(p,amt);p.acted=true;
 if(p.paid>oldBet){let jump=p.paid-oldBet;G.bet=p.paid;if(jump>=G.minRaise){G.minRaise=jump;for(let q of active())if(q.seat!==p.seat&&q.stack>0)q.acted=false}}
 log(p.seat+'번 '+(kind==='allin'?'올인':kind==='raise'?'레이즈':kind==='call'?'콜':'베팅')+' '+fmt(amt)+'칩 (총 '+fmt(p.paid)+')')
 }
 p.stats??={raises:0,calls:0,folds:0};if(kind==='fold')p.stats.folds++;else if(kind==='call')p.stats.calls++;else if(kind==='raise'||kind==='allin'&&p.paid>oldBet)p.stats.raises++;
 G.actionLog??=[];G.actionLog.push({seat:p.seat,street:G.street,kind:kind==='fold'?'FOLD':kind==='check'?'CHECK':kind==='call'?'CALL':kind==='allin'?'ALL-IN':'RAISE',amount:amt,total:p.paid});
 advance()
}
function ai(){
 const p=pl(G.turn),t=p.profile||profiles[7],due=Math.max(0,G.bet-p.paid),bb=G.bb;
 const vals=p.hole.map(c=>ranks.indexOf(c[0])+2).sort((a,b)=>b-a),pair=vals[0]===vals[1],suited=p.hole[0][1]===p.hole[1][1],gap=vals[0]-vals[1];
 const premium=pair&&vals[0]>=11||vals[0]===14&&vals[1]>=12;
 const playable=pair&&vals[0]>=6||vals[0]>=12&&vals[1]>=10||vals[0]===14&&vals[1]>=9||suited&&vals[0]>=10&&gap<=3;
 const marginal=pair||vals[0]>=11&&vals[1]>=8||suited&&gap<=3;
 const loose=t.tight<.35,aggressive=t.aggr>.6;
 const board=G.board,boardRanks=board.map(c=>c[0]);
 const matches=p.hole.filter(c=>boardRanks.includes(c[0])).length;
 const all=[...p.hole,...board];
 const freq={};all.forEach(c=>freq[c[0]]=(freq[c[0]]||0)+1);
 const maxGroup=Math.max(...Object.values(freq));
 const hasPair=maxGroup>=2,hasTrips=maxGroup>=3;
 const flushDraw=suits.split('').some(x=>all.filter(c=>c[1]===x).length>=4);
 const madeStrong=board.length===5?score(all)[0]>=2:hasTrips||matches>=2;
 const decentPost=madeStrong||matches>0||pair||flushDraw;
 const opponents=G.p.filter(x=>x.seat!==p.seat&&!x.fold&&!x.out);
 const headsUp=opponents.length===1;
 const boardSuits=board.reduce((m,c)=>(m[c[1]]=(m[c[1]]||0)+1,m),{});
 const draws=flushDraw||board.length>=3&&board.some(c=>boardSuits[c[1]]>=2&&p.hole.some(h=>h[1]===c[1]));
 const overcards=vals.filter(v=>v>Math.max(0,...board.map(c=>ranks.indexOf(c[0])+2))).length;
 const dryBoard=board.length>=3&&!Object.values(boardSuits).some(n=>n>=2)&&new Set(boardRanks).size===boardRanks.length;
 const weakShowdown=!hasPair&&!madeStrong;
 const plausibleSemi=draws||overcards>=1&&board.length<=4;
 const pressureOk=p.stack>Math.max(bb*8,G.pot*.75)&&G.pot>0;
 const bluffChance=Math.min(.38,(t.bluff||0)*(.5+(t.aggr||0)*.8));
 const mixRoll=random();
 const minRaiseTo=Math.max(G.bet+G.minRaise,bb);
 const chooseRaise=ratio=>{
  const total=Math.min(p.stack+p.paid,Math.max(minRaiseTo,Math.round((G.bet+Math.max(bb,G.pot*ratio))/bb)*bb));
  if(total>=minRaiseTo&&total>G.bet){action('raise',total);return true}
  return false;
 };
 // Bluffing must depend on opponent count, remaining stack, board, and personality.
 const canBluff=headsUp&&pressureOk&&weakShowdown&&!/콜링|루즈패시브/.test(t.name||'');
 const slowplay=madeStrong&&headsUp&&dryBoard&&p.stack>bb*12&&random()<.18+(t.aggr||0)*.1;
 const expensive=due>Math.max(bb*5,G.pot*.38);
 const huge=due>Math.max(bb*12,p.stack*.28);
 if(G.street==='PREFLOP'){
  if(due>0){
   if(huge&&!premium){action('fold');return}
   if(expensive&&!playable){action('fold');return}
   if(!playable&&!(loose&&marginal&&random()<.42)){action('fold');return}
   if(premium&&due<=bb*5&&p.stack>bb*15&&random()<t.aggr*.7){
    let target=Math.min(p.stack+p.paid,Math.max(G.bet+G.minRaise,Math.round(G.bet*(2.7+random()*.7)/bb)*bb));
    if(target>G.bet&&target>=G.bet+G.minRaise){action('raise',target);return}
   }
   action('call');return
  }
  if((premium||playable&&aggressive)&&random()<t.aggr*.65&&p.stack>bb*5){
   let target=Math.min(p.stack+p.paid,Math.max(G.bet+G.minRaise,Math.round((2.2+random()*.8)*bb/bb)*bb));
   if(target>G.bet&&target>=G.bet+G.minRaise){action('raise',target);return}
  }
  action('check');return
 }
 if(due>0){
  // Low-frequency semi-bluff raise; do not bluff-raise calling stations or multiway pots.
  if(canBluff&&plausibleSemi&&due<=G.pot*.28&&mixRoll<bluffChance*.42&&chooseRaise(.75))return;
  if(huge&&!madeStrong){action('fold');return}
  if(expensive&&!decentPost){action('fold');return}
  if(!decentPost&&random()>(loose?.22:.06)){action('fold');return}
  if(madeStrong&&due<=G.pot*.45&&random()<t.aggr*.3&&p.stack>due+bb*3){
   let target=Math.min(p.stack+p.paid,G.bet+Math.max(G.minRaise,Math.round(G.pot*.6/bb)*bb));
   if(target>=G.bet+G.minRaise){action('raise',target);return}
  }
  action('call');return
 }
 if(slowplay){action('check');return}
 if(canBluff&&(plausibleSemi||G.street==='RIVER')&&mixRoll<bluffChance&&chooseRaise(G.street==='RIVER'?.72:.48))return;
 if((madeStrong||decentPost&&aggressive)&&random()<t.aggr*.48&&p.stack>bb*2){
  let target=Math.min(p.stack+p.paid,Math.max(bb,Math.round(G.pot*(.3+random()*.25)/bb)*bb));
  if(target>=bb){action('raise',target);return}
 }
 if(!decentPost&&headsUp&&pressureOk&&random()<t.bluff*.12&&p.stack>bb*3){
  let target=Math.min(p.stack+p.paid,Math.max(bb,Math.round(G.pot*.3/bb)*bb));
  if(target>=bb){action('raise',target);return}
 }
 action('check')
}

 if(logEl)logEl.innerHTML=G.log.slice(0,14).map(x=>'<div class="action-history-row">'+x+'</div>').join('');
}

function open(){if(G){render();return}document.getElementById('plc-test-overlay')?.remove();let d=document.createElement('div');d.id='plc-test-overlay';d.style.cssText='position:fixed;inset:0;overflow:auto;z-index:99999;background:#08101e;padding:12px';d.innerHTML='<div id="playable-root"></div>';document.body.append(d);choose()}
function choose(){let root=$();root.innerHTML='<div style="max-width:560px;margin:40px auto;color:white;text-align:center"><h2>🎲 9인 새틀라이트</h2><p>내가 앉을 자리를 선택하세요. 각 30,000칩 · 100/200 시작 · AI 8명</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">'+Array.from({length:9},(_,i)=>'<button onclick="plcTestSeat('+(i+1)+')" style="padding:22px 5px;background:#26445a;color:white;border-radius:12px">'+(i+1)+'번 좌석</button>').join('')+'</div><button onclick="plcTestHome()" style="margin-top:24px">돌아가기</button></div>'}
window.plcTestSeat=n=>{start(n)};
window.plcTestAct=(k)=>action(k);
window.plcTestRaise=()=>{let t=Number(document.getElementById('plc-test-raise').value);action('raise',t)};
window.plcTestNext=nextHand;
window.plcTestStep=stepAI;
window.plcTestControls=()=>{if(!G)return '';let h=pl(G.hero),turn=G.phase==='play'&&G.turn===G.hero&&!h.fold&&h.stack>0,due=Math.max(0,G.bet-h.paid),min=G.bet?G.bet+G.minRaise:G.bb,max=h.stack+h.paid;if(turn)return '<div class="compact-actions"><button class="danger" onclick="plcTestAct(&quot;fold&quot;)">폴드</button><button onclick="plcTestAct(&quot;'+(due?'call':'check')+'&quot;)">'+(due?'콜 '+fmt(Math.min(due,h.stack)):'체크')+'</button><button onclick="plcTestAct(&quot;allin&quot;)">올인</button></div><div class="compact-amount"><b>AI 추천 레이즈 총액</b> <input id="plc-test-raise" type="number" value="'+Math.min(max,Math.max(min,Number(window.__plcSuggestedRaise)||G.bb*3))+'" min="'+min+'" max="'+max+'" style="width:130px;color:#111;background:#fff"> <button class="primary" onclick="plcTestRaise()">베팅 / 레이즈</button></div>';if(G.phase==='between')return '<button class="primary" onclick="plcTestNext()">▶ 다음 핸드</button>';if(G.phase==='finished')return '토너먼트 종료';return '<button class="primary" onclick="plcTestStep()">▶ '+G.turn+'번 AI 행동 보기</button>'};
window.plcTestHome=()=>{document.getElementById('plc-test-overlay')?.remove();state.playableBridge=false;state.screen='home';render()};
window.plcTestReset=()=>{if(confirm('테스트를 처음부터 다시 시작할까요?')){G=null;localStorage.removeItem(KEY);open()}};
window.plcTestStart=()=>{try{let raw=localStorage.getItem(KEY);G=raw?JSON.parse(raw):null;if(!G||!Array.isArray(G.p)||G.p.length!==9)G=null}catch(e){G=null}open()};
})();
</script></body></html>
