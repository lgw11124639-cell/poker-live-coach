const KEY='plc_safari_v1';const DENOMS=[{v:100,c:'#EBCF33',t:'#171717'},{v:500,c:'#E88DB8',t:'#171717'},{v:1000,c:'#258E4E',t:'#fff'},{v:5000,c:'#EC8427',t:'#fff'},{v:10000,c:'#26272B',t:'#fff'},{v:25000,c:'#266BCC',t:'#fff'},{v:50000,c:'#CC333F',t:'#fff'}];
const LEVELS=[[100,200],[200,400],[300,600],[400,800],[500,1000],[600,1200],[800,1600],[1000,2000],[1500,3000],[2000,4000],[3000,6000],[4000,8000],[5000,10000],[6000,12000],[7000,14000],[8000,16000],[9000,18000],[10000,20000],[15000,30000],[20000,40000],[25000,50000],[30000,60000],[35000,70000],[40000,80000]];const F=n=>Math.round(n||0).toLocaleString('ko-KR');const E=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initial=()=>({screen:'home',mode:'coach',gameType:'새틀라이트',table:1,seats:9,sb:100,bb:200,starting:30000,rebuy:40000,early:5000,earlyEnabled:true,level:1,levelEndsAt:0,pendingLevel:0,registrationOpen:true,washTarget:[],button:9,hand:1,pot:0,players:[],street:'PREFLOP',selected:1,heroSeat:0,joinMid:false,joinLevel:1,joinMinutes:20,joinHeroSeat:1,joinHeroStack:30000,joinButtonSeat:1,occupiedSeats:[1,2,3,4,5,6,7,8,9],amount:0,wash:[],breakQueued:false,washQueued:false,paused:'',history:[],games:[],cards:{hero:[],board:[]},view:'table'});
let state=initial();try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.screen)state={...state,...s}}catch(_){};const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(_){}};const active=()=>state.players.filter(p=>!p.folded&&p.stack>=0);const getSeat=n=>state.players.find(p=>p.seat===n);const nextOccupied=(seat,players=state.players)=>{for(let i=1;i<=10;i++){const n=(seat+i-1)%10+1;if(players.some(p=>p.seat===n&&p.stack>0))return n}return seat};
function role(seat){
 const inHand=state.players.filter(p=>!p.folded||p.contributed>0||p.stack>0).filter(p=>p.handDealt!==false);
 const seats=state.handPositionSeats?.length?state.handPositionSeats:inHand.map(p=>p.seat);
 const order=seats.slice().sort((a,b)=>a-b);
 if(order.length<2||!order.includes(seat))return '';
 const after=n=>{const i=order.findIndex(x=>x>n);return order[i<0?0:i]};
 const btn=order.includes(state.handPositionButton)?state.handPositionButton:state.button;
 const sb=order.length===2?btn:after(btn),bb=after(sb);
 if(seat===btn)return 'BTN';
 if(seat===sb)return 'SB';
 if(seat===bb)return 'BB';
 const remaining=[];let pos=after(bb);while(pos!==btn&&remaining.length<order.length){remaining.push(pos);pos=after(pos)}
 const names=remaining.length===1?['CO']:remaining.length===2?['UTG','CO']:remaining.length===3?['UTG','HJ','CO']:remaining.length===4?['UTG','MP','HJ','CO']:remaining.length===5?['UTG','UTG+1','MP','HJ','CO']:remaining.length===6?['UTG','UTG+1','MP','LJ','HJ','CO']:['UTG','UTG+1','UTG+2','MP','LJ','HJ','CO'];
 return names[remaining.indexOf(seat)]||''
}
function setBlindLevel(n){state.level=n;const a=LEVELS[n-1];if(a){state.sb=a[0];state.bb=a[1]}state.levelEndsAt=Date.now()+1200000;state.levelTimeExpired=false;state.pendingLevel=0}
function applyPending(){if(state.pendingLevel)setBlindLevel(state.pendingLevel)}
function clockTick(){if(state.screen!=='game'||state.paused||state.gameType!=='새틀라이트'||!state.players.length)return;const sec=Math.max(0,Math.ceil((state.levelEndsAt-Date.now())/1000));const el=document.getElementById('timer-live');if(el)el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec===0&&!state.levelTimeExpired){state.levelTimeExpired=true;state.history.unshift('레벨 시간 종료 · 수동 블라인드 업 대기');render()}}setInterval(clockTick,1000);
function prepareHand(first=false){const live=state.players.filter(p=>p.stack>0);if(live.length<2){state.paused='인원 부족';return}if(!first)state.button=nextOccupied(state.button,live);const sbSeat=nextOccupied(state.button,live),bbSeat=nextOccupied(sbSeat,live);state.players=state.players.map(p=>({...p,folded:p.stack<=0}));let posted=0;for(const [seat,amt] of [[sbSeat,state.sb],[bbSeat,state.bb],...(state.gameType==='새틀라이트'&&state.level>=3?[[bbSeat,state.bb]]:[])]){const p=getSeat(seat);if(p){const a=Math.min(p.stack,amt);p.stack-=a;posted+=a}}state.pot=posted;state.amount=0;state.street='PREFLOP';state.cards={hero:[],board:[]};state.selected=nextOccupied(bbSeat,live);state.history.unshift('#'+state.hand+' 시작 · 블라인드 '+F(state.sb)+'/'+F(state.bb));}
function makeGame(){const seatCount=Math.min(10,Math.max(2,Number(state.seats)||9)), stack=Math.max(1,Number(state.starting)||30000)+(state.earlyEnabled?Number(state.early)||0:0);state.seats=seatCount;state.registrationOpen=true;state.pendingLevel=0;state.washTarget=[];if(state.gameType==='새틀라이트')setBlindLevel(1);const occupied=(state.occupiedSeats||[]).slice(0,10);const chairs=occupied.length>=2?occupied:Array.from({length:seatCount},(_,i)=>i+1);state.seats=chairs.length;state.players=chairs.map(seat=>({seat,stack,folded:false,played:0,raises:0,calls:0,folds:0,revealed:[]}));state.button=chairs[chairs.length-1];state.heroSeat=0;state.hand=1;if(state.joinMid&&state.gameType==='새틀라이트'){const lev=Math.max(1,Math.min(LEVELS.length,Number(state.joinLevel)||1));setBlindLevel(lev);state.levelEndsAt=Date.now()+Math.max(1,Math.min(20,Number(state.joinMinutes)||20))*60000;state.registrationOpen=lev<=10;state.wash=lev>18?[100,500,1000]:lev>10?[100,500]:[];state.heroSeat=chairs.includes(Number(state.joinHeroSeat))?Number(state.joinHeroSeat):chairs[0];const me=state.players.find(p=>p.seat===state.heroSeat);if(me)me.stack=Math.max(1,Number(state.joinHeroStack)||30000);state.button=chairs.includes(Number(state.joinButtonSeat))?Number(state.joinButtonSeat):chairs[chairs.length-1];state.history.unshift('진행 중인 새틀라이트 레벨 '+lev+'부터 기록 시작 · 이전 핸드 기록 없음')}state.history=state.joinMid?state.history:[];state.wash=state.joinMid?state.wash:[];state.breakQueued=false;state.washQueued=false;state.paused='';prepareHand(true);state.screen='game';render()}
function finish(winner){const p=getSeat(winner);if(!p)return;const award=state.pot;p.stack+=award;state.history.unshift('#'+state.hand+' '+winner+'번 승리 +'+F(award)+'칩');state.games.unshift({at:new Date().toLocaleString('ko-KR'),hand:state.hand,winner,pot:award,mode:state.mode,blind:state.sb+'/'+state.bb});state.games=state.games.slice(0,100);state.pot=0;if(state.gameType==='새틀라이트'&&state.pendingLevel===11){state.paused='break';state.registrationOpen=false;state.washTarget=[100,500];state.washQueued=true;state.breakQueued=false}else if(state.gameType==='새틀라이트'&&state.pendingLevel===19){state.paused='break';state.washQueued=true;state.washTarget=[1000];state.history.unshift('18레벨 10,000/20,000 종료 · 브레이크 + 1,000칩 워싱')}else if(state.gameType==='새틀라이트'&&state.pendingLevel===25){state.paused='break';state.washQueued=true;state.washTarget=[5000];state.history.unshift('24레벨 40,000/80,000 종료 · 브레이크 + 5,000칩 워싱')}else if(state.breakQueued){state.paused='break';state.breakQueued=false}else if(state.washQueued){state.paused='wash';state.washQueued=false}else{applyPending();state.hand++;prepareHand()}render()}
function fold(){if(state.paused)return;const p=getSeat(state.selected);if(!p||p.folded)return;p.folded=true;p.folds++;state.history.unshift('#'+state.hand+' '+p.seat+'번 폴드');const remaining=active();if(remaining.length===1){finish(remaining[0].seat);return}const nxt=nextOccupied(state.selected,remaining);state.selected=nxt;render()}
function betAction(kind){if(state.paused)return;const p=getSeat(state.selected);if(!p||p.folded)return;if(kind==='FOLD'){fold();return}if(kind==='CHECK'){state.history.unshift('#'+state.hand+' '+p.seat+'번 체크');}else{const amt=kind==='ALL-IN'?p.stack:Math.min(p.stack,state.amount);if(amt<=0)return;p.stack-=amt;state.pot+=amt;if(kind==='CALL')p.calls++;else p.raises++;state.history.unshift('#'+state.hand+' '+p.seat+'번 '+kind+' '+F(amt)+'칩');state.amount=0}state.selected=nextOccupied(state.selected,active());render()}

function opponentRangeGrid(seat){
 const ranks='AKQJT98765432',suits='SHDC';
 const pre=(state.handActions||[]).filter(a=>a.seat===seat&&a.hand===state.hand&&a.street==='PREFLOP');
 const raised=pre.some(a=>a.kind==='RAISE'||a.kind==='ALL-IN'),called=pre.some(a=>a.kind==='CALL');
 const live=state.players.filter(p=>p.stack>0||p.contributed>0);
 const dealerIndex=live.findIndex(p=>p.seat===state.button),index=live.findIndex(p=>p.seat===seat);
 const relative=(index-dealerIndex+live.length)%Math.max(1,live.length);
 const early=live.length>=6&&relative>=3&&relative<=Math.floor(live.length/2)+1;
 const blocked=new Set([...(state.cards?.board||[]),...(getSeat(state.heroSeat)?.cards||[])]);
 const available=(r1,r2,suited)=>{let n=0;for(const a of suits)for(const b of suits){if((r1===r2&&suits.indexOf(a)>=suits.indexOf(b))||(r1!==r2&&suited!==(a===b)))continue;if(!blocked.has(r1+a)&&!blocked.has(r2+b))n++}return n};
 const entries=[];let included=0,combos=0;
 for(let i=0;i<13;i++)for(let j=0;j<13;j++){
  const pair=i===j,suited=i<j,r1=ranks[Math.min(i,j)],r2=ranks[Math.max(i,j)];
  const max=pair?6:suited?4:12,remain=available(r1,r2,suited);
  let quality=pair?(27-i*1.75):(26-Math.min(i,j)*1.4-Math.max(i,j)*1.05+(suited?4:0));
  if(suited&&Math.abs(i-j)===1)quality+=3;
  if(early)quality-=4;
  const cutoff=raised?18:called?12:10;
  const active=quality>=cutoff&&remain>0;
  const hand=r1+(pair?'':r2)+(pair?'':suited?'s':'o');
  if(active){included++;combos+=remain}
  entries.push({hand,remain,max,active})
 }
 const rows=Array.from({length:13},(_,i)=>'<div class="range-row">'+entries.slice(i*13,i*13+13).map(c=>'<span class="range-cell '+(c.active?'included':'excluded')+'" title="'+c.hand+' · 남은 '+c.remain+'/'+c.max+'콤보">'+c.hand+'</span>').join('')+'</div>').join('');
 return '<details class="range-box"><summary>♠ 예상 핸드레인지 13×13 · '+included+'/169 핸드 유형</summary><p class="coach-note">선택 좌석의 프리플랍 액션·대략적 포지션으로 만든 예시 범위입니다. 내 카드와 공개 보드에 막힌 조합은 제외했습니다. 상대의 실제 확률은 아닙니다.</p><div class="range-matrix">'+rows+'</div><div class="coach-meta">표시된 후보 총 '+combos+'개 잔여 조합 · 색 표시=후보 · 어둡게=제외 · 카드에 막힌 조합은 0개로 처리</div></details>'
}

 if(actions.length){

  else if(calls){range='중간 포켓페어, 브로드웨이, 수딧 에이스·커넥터, 강한 핸드의 슬로플레이 가능성';value=board.length?'탑페어·중간 페어, 드로우로 콜, 일부 슬로플레이':'22–JJ, AQ–AT, KQ, 수딧 카드 일부';bluff=board.length?'플러시·스트레이트 드로우 콜 가능성 (블러프와 구분 불가)':'콜만으로 블러프 콤보 단정 불가'}

 }
 const caveat='예시 후보이며 실제 상대 핸드 확률·GTO 솔버 결과가 아닙니다. '+(sample==='매우 낮음'?'현재 기록이 적어 신뢰도가 매우 낮습니다.':'추정 신뢰도 '+sample+' (액션 기록 기준).');
 return '<details class="coach-panel" open><summary>🧠 '+seat+'번 상대 추정 · '+E(tendency)+'</summary>'+
 '<div class="coach-meta">관찰: 레이즈 '+(p.raises||0)+' · 콜 '+(p.calls||0)+' · 폴드 '+(p.folds||0)+' / 이번 핸드 공격 '+aggressive+' · 콜 '+calls+'</div>'+

h+='<div class="compact-utility"><button onclick="plcInputHole()">홀카드</button><button onclick="plcInputBoard()">보드</button><button onclick="plcShowdown()">쇼다운</button><button onclick="plcNextStreet()">스트리트</button></div>';
h+='<button class="compact-next" onclick="plcManualNextHand()">▶ 다음 핸드</button>';
h+='<details class="seat-action-history" open><summary>📋 '+state.selected+'번 좌석 · 스트리트별 액션</summary>'+['PREFLOP','FLOP','TURN','RIVER'].map(st=>'<div class="action-history-row"><b>'+({PREFLOP:'프리플랍',FLOP:'플랍',TURN:'턴',RIVER:'리버'}[st])+'</b><span>'+((state.handActions||[]).filter(a=>a.seat===state.selected&&a.street===st&&a.hand===state.hand).map(a=>({FOLD:'폴드',CHECK:'체크',CALL:'콜',RAISE:'레이즈','ALL-IN':'올인'}[a.kind]||a.kind)+(a.amount?' '+F(a.amount):'')).join(' → ')||'—')+'</span></div>').join('')+'</details>';
h+=coachPanel();
h+='<details class="compact-more"><summary>게임 기록 · 관리 메뉴</summary><div class="compact-utility"><button onclick="setScreen(&quot;records&quot;)">기록</button><button onclick="editSeatStack()">스택 수정</button><button onclick="changeBlind()">블라인드</button><button onclick="nextLevelManually()">레벨 예약</button><button onclick="rebuySelected()">리바인</button><button onclick="balanceTable()">⇄ 테이블 밸런싱</button><button onclick="toggleQueue(&quot;breakQueued&quot;)">브레이크</button><button onclick="toggleQueue(&quot;washQueued&quot;)">워싱</button></div><div class="small muted">'+state.history.slice(0,5).map(E).join(' · ')+'</div></details></div>';
return h+footer()
}
function pausePanel(){if(state.paused==='showdown')return `<div class="panel"><h2>🃏 쇼다운 대기</h2><p class="small muted">참가자의 홀카드와 보드 5장을 선택한 다음 쇼다운 자동 판정을 눌러주세요. 정보가 부족하면 임의로 다음 핸드로 넘어가지 않습니다.</p><button class="primary" onclick="plcShowdownEntry()">🃏 상대 카드 공개 / 먹(Muck) 입력</button>${(state.cards?.board||[]).length<5?`<button class="board-callout" onclick="plcResumeRunout()">▶ 남은 보드 입력 · 리버까지 진행</button>`:""}</div>`;return `<div class="panel"><h2>${state.paused==='break'?'⏸ 브레이크 중':'♻ 워싱 중'}</h2>${state.paused==='wash'?`<p class="small muted">예정 워싱: ${state.washTarget?.map(F).join(', ')||'칩 종류 미확인 · 직접 선택'}칩 · 실제 교환 및 스택 확인 후 완료하세요. 추가로 입력창에서 제외할 칩을 선택</p><div class="row">${DENOMS.filter(x=>!state.wash.includes(x.v)).map(x=>btn(F(x.v),'washChip('+x.v+')','ghost')).join('')}</div>`:`<p class="small muted">현재 핸드가 종료되어 다음 핸드 진행을 중지했어.</p>`}${btn(state.paused==='break'?'브레이크 종료':'워싱 완료','proceed()','wide primary')}</div>`}
function records(){return `${header()}<h2>게임 기록</h2><div class="panel"><div class="title">저장된 핸드 (${state.games.length})</div>${state.games.length?state.games.map(g=>`<div class="log">${E(g.at)} · #${g.hand} · ${g.winner}번 승리 · ${F(g.pot)}칩 · ${E(g.mode)}</div>`).join(''):'<p class="muted small">아직 종료된 핸드가 없어.</p>'}</div><div class="panel"><div class="title">상대별 현재 통계 (초기형)</div>${state.players.map(p=>`<div class="log">${p.seat}번 · 콜 ${p.calls} · 레이즈 ${p.raises} · 폴드 ${p.folds} · 스택 ${F(p.stack)}</div>`).join('')||'기록 없음'}</div><div class="note">통계는 액션 수 기반의 기초 집계야. VPIP·PFR·3Bet의 정확한 분모 및 쇼다운 핸드 평가는 다음 개발 단계에서 구현해.</div>${footer()}`}
function cards(){const p=getSeat(state.selected);return `${header()}<h2>카드 선택 · 쇼다운</h2><div class="panel"><div class="between"><b>${state.selected}번 좌석</b><span class="pill">${E(state.street)}</span></div><p class="small muted">현재 참가 좌석을 선택하고 홀카드와 커뮤니티 카드를 누르면 52장 선택판이 열려.</p><p>홀카드: <b>${E((p?.cards||[]).join(' ')||'미입력')}</b></p><p>보드: <b>${E((state.cards?.board||[]).join(' ')||'미입력')}</b></p><div class="grid2">${btn('홀카드 2장 선택','plcInputHole()','primary')}${btn('보드 5장 선택','plcInputBoard()','primary')}${btn('다음 스트리트','plcNextStreet()','ghost')}${btn('쇼다운 자동 판정','plcShowdown()','success')}</div></div>${btn('테이블 돌아가기','setScreen("game")','wide')}`}
function footer(){return '<div class="footer">오프라인 개인 연습·기록용 프로토타입 · 실제 게임 규정 확인 필요<br>쇼다운·사이드팟·정확한 코칭 엔진은 개발 중</div>'}
function render(){persist();document.getElementById('app').innerHTML=state.screen==='home'?home():state.screen==='setup'?setup():state.screen==='records'?records():state.screen==='cards'?cards():game()};
function toggleOccupied(n){state.occupiedSeats??=[1,2,3,4,5,6,7,8,9];const has=state.occupiedSeats.includes(n);if(has&&state.occupiedSeats.length<=2){alert('최소 2명이 필요해요');return}state.occupiedSeats=has?state.occupiedSeats.filter(x=>x!==n):[...state.occupiedSeats,n].sort((a,b)=>a-b);state.seats=state.occupiedSeats.length;render()}function setScreen(s){state.screen=s;render()}function goHome(){state.screen='home';render()}function update(k,v){state[k]=v;if(k==='gameType'&&v==='새틀라이트'){state.starting=30000;state.rebuy=40000;state.early=5000;state.sb=100;state.bb=200}render()}function updateNumber(k,v){state[k]=Math.max(0,Number(v)||0);persist()}function setMode(m){state.mode=m;render()}async function forceAppUpdate(){
 if(!confirm('새 버전을 확인하고 화면을 새로 불러올까요? 게임 기록은 유지됩니다.'))return;
 try{if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(r=>r.unregister()));}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('poker-live-coach')).map(k=>caches.delete(k)));}}catch(e){console.warn('업데이트 캐시 초기화 오류',e)}
 location.replace('./?fresh='+Date.now())
}
function selectSeat(n){state.selected=n;render()}function balanceTable(){
 if(!state.heroSeat||!getSeat(state.heroSeat)){alert('먼저 내 자리를 지정해주세요.');return}
 if(state.paused&&state.paused!=='showdown'){alert('브레이크/워싱을 완료한 뒤 테이블을 이동하세요.');return}
 if((state.actions||0)>0||state.street!=='PREFLOP'){alert('진행 중인 핸드는 먼저 끝내고 이동하세요.');return}
 const oldHero=getSeat(state.heroSeat),oldTable=state.table,oldSeat=state.heroSeat;
 const t=prompt('이동할 새 테이블 번호',String(Number(state.table||1)+1));if(t===null)return;
 const table=Number(t);if(!Number.isInteger(table)||table<1||table>999){alert('올바른 테이블 번호를 입력하세요.');return}
 const n=prompt('새 테이블 참가 인원 (2~10명)','9');if(n===null)return;
 const count=Number(n);if(!Number.isInteger(count)||count<2||count>10){alert('2~10명을 입력하세요.');return}
 const hs=prompt('새 테이블 내 좌석 번호 (1~10)',String(Math.min(oldSeat,count)));if(hs===null)return;
 const heroSeat=Number(hs);if(!Number.isInteger(heroSeat)||heroSeat<1||heroSeat>10){alert('내 좌석 번호를 확인하세요.');return}
 const ds=prompt('새 테이블 딜러 버튼 좌석 번호 (1~10)','1');if(ds===null)return;
 const dealer=Number(ds);if(!Number.isInteger(dealer)||dealer<1||dealer>10){alert('딜러 버튼 번호를 확인하세요.');return}
 const seats=Array.from({length:10},(_,i)=>i+1);
 const occupied=seats.slice(0,count);
 if(!occupied.includes(heroSeat)||!occupied.includes(dealer)){alert('내 자리와 딜러 좌석은 참가 좌석 범위 안이어야 합니다.');return}
 if(!confirm(oldTable+'번 테이블 → '+table+'번 테이블로 이동할까요? 내 스택과 이전 핸드 기록을 유지합니다. 새 테이블 상대 스택은 시작 스택으로 임시 표시되어 수정이 필요합니다.'))return;
 // A just-started hand has forced blinds but no decisions. Refund those before moving.
 state.players.forEach(p=>{const paid=p.contributed||0;p.stack+=paid});
 const heroStack=getSeat(oldSeat).stack;
 state.table=table;state.heroSeat=heroSeat;state.occupiedSeats=occupied;state.seats=count;state.button=dealer;state.nextDealerSeat=0;
 state.players=occupied.map(seat=>({seat,stack:seat===heroSeat?heroStack:Number(state.starting)||30000,folded:false,played:0,raises:0,calls:0,folds:0,revealed:[]}));
 state.hand=(state.hand||1)+1;state.actions=0;state.paused='';state.amount=0;state.pendingLevel=0;
 state.history.unshift('밸런싱: TABLE '+oldTable+' / '+oldSeat+'번 → TABLE '+table+' / '+heroSeat+'번 (내 스택 '+F(heroStack)+'칩)');
 prepareHand(true);state.screen='game';render();
 if(typeof window.plcHeroHole==='function')window.plcHeroHole()
}
function chooseDealer(){const p=getSeat(state.selected);if(!p||p.stack<=0){alert('칩이 남아 있는 좌석만 딜러로 지정할 수 있습니다.');return}state.nextDealerSeat=state.selected;state.history.unshift(state.selected+'번 딜러 버튼 지정 · 다음 핸드부터 적용');alert(state.selected+'번을 다음 핸드 딜러로 지정했습니다. 현재 핸드의 액션 순서는 유지됩니다.');render()}function setHeroSeat(){if(!getSeat(state.selected))return;state.heroSeat=state.selected;state.history.unshift('내 자리 '+state.heroSeat+'번 지정');if(typeof window.plcResetToUTG==='function')window.plcResetToUTG();render();if(typeof window.plcHeroHole==='function'){try{window.plcHeroHole()}catch(err){alert('카드 선택창 오류: '+err.message)}}else alert('카드 엔진이 로드되지 않았습니다. 새로고침해주세요.')}function addChip(n){state.amount+=n;state.chipPadOpen=true;render()}function clearAmount(){state.amount=0;render()}function toggleChipPad(v){state.chipPadOpen=!!v;render()}function setAmount(n){state.amount=n;render()}function toggleQueue(k){state[k]=!state[k];render()}function washChip(v){if(!state.wash.includes(v))state.wash.push(v);render()}function advanceStreet(){const a=['PREFLOP','FLOP','TURN','RIVER'];state.street=a[Math.min(3,a.indexOf(state.street)+1)];state.history.unshift('#'+state.hand+' '+state.street+' 시작');render()}function changeBlind(){const b=prompt('새 BB 칩 단위',state.bb);if(b===null)return;const n=Number(b);if(!Number.isFinite(n)||n<=0)return;state.bb=n;state.sb=n/2;render()};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script src="./hand-engine.js?v=36"></script></body></html>
