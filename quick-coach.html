:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06101d;color:#f7f9ff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:12px;padding:env(safe-area-inset-top) 8px calc(15px + env(safe-area-inset-bottom));max-width:560px;margin:auto}button,input,select{font:inherit}button{touch-action:manipulation;background:#1a2b42;color:white;border:1px solid #35506e;border-radius:9px;padding:7px 4px;min-height:34px;font-weight:700}button:active{filter:brightness(1.3)}.line{display:flex;justify-content:space-between;align-items:center;gap:7px}.panel{background:linear-gradient(130deg,#102035,#0b192b);border:1px solid #28405c;border-radius:13px;padding:9px;margin:7px 0}.muted{font-size:10px;color:#9babc3}.mini{font-size:11px}.field{background:#0b182a;color:#fff;border:1px solid #354b65;border-radius:8px;width:100%;min-width:0;padding:6px;font-size:12px}label{display:block;color:#a9b8cc;font-size:10px;margin-bottom:3px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:7px}.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.big{font-size:28px;font-weight:900}.card{display:inline-flex;background:#fdfdfd;color:#10151f;border-radius:7px;width:clamp(30px,9vw,46px);height:49px;align-items:center;justify-content:center;font-size:19px;font-weight:900}.card.red{color:#e22737}.cards{display:flex;gap:4px;margin-top:6px;min-height:49px;align-items:center}.primary{background:#1b69cc}.danger{background:#c92d3a}.on{background:#188e59}.sheet{position:fixed;inset:0;background:#030814ee;z-index:30;display:none;overflow:auto;padding:25px 12px}.sheet.open{display:block}.sheetbody{max-width:450px;margin:auto;background:#12233a;border:1px solid #395472;border-radius:15px;padding:13px}.ranks{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.suits{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.sheet button{min-height:45px}.sheet .on{background:#188e59}.footer{font-size:10px;color:#9c  .money-actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:8px}.money-actions button{min-height:44px;font-size:12px;padding:7px 2px}.money-actions #actFold{background:#343f4d}.money-actions #actCheck{background:#1765b9}.money-actions #actCall{background:#13945b}.money-actions #actRaise{background:#cf6c17}.money-actions #actAllin{background:#c92c3b}.money .smallnote{color:#9bbdb4} .money-actions{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:5px;margin-top:8px}.money-actions button{min-height:46px!important;font-size:12px!important;padding:6px 1px}.money .quick-tools{margin-top:7px}.table .streetBtns{margin-top:8px}.table .actions{display:none!important} </style></head><body>
<header class="line head"><h1>♠ POKER QUICK COACH</h1><button class="mini" id="reset">⟳ 초기화</button></header>
<div class="panel"><div class="settings"><div><label>블라인드 SB</label><input class="field" id="sb" type="number" min="0" value="100"></div><div><label>BB</label><input class="field" id="bb" type="number" min="1" value="200"></div><div><label>내 스택</label><input class="field" id="stack" type="number" min="0" value="30000"></div><div><label>내 위치</label><select class="field" id="pos"><option>BTN</option><option>CO</option><option>HJ</option><option>LJ</option><option>UTG</option><option>MP</option><option>SB</option><option>BB</option></select></div></div><div class="hidden"><input id="ante" type="number" value="0"><select id="style"><option value="unknown">정보 없음</option><option value="tight">타이트</option><option value="loose">루즈</option><option value="station">콜스테이션</option></select></div></div>

<div class="panel money"><div class="potline"><div><div class="muted">현재 팟</div><div class="big" id="pot">300</div></div><div><div class="muted">베팅 / 레이즈 금액</div><div class="big" id="draft">0</div></div></div><div class="grid" id="chips"></div><div class="money-actions"><button id="actFold">폴드</button><button id="actCheck">체크</button><button id="actCall">콜</button><button id="actRaise">레이즈</button><button id="actAllin">올인</button></div><div class="quick-tools"><button id="undo">↶ 취소</button><button id="clear">입력 지움</button><button class="primary" id="add">팟 추가</button><button id="adjust">팟 수정</button></div><div class="smallnote" id="betHint">칩 금액 → 바로 아래 액션 버튼 · 콜은 자동 금액</div></div>
<div class="panel table" id="turnPanel"><div class="line"><strong>🎯 좌석 · 현재 액션 순서</strong><button id="turnRestart" class="mini">새 판</button></div><div class="config"><div><label>테이블 인원</label><select class="field" id="seatCount"><option>9</option><option>10</option><option>8</option><option>7</option><option>6</option><option>5</option><option>4</option><option>3</option><option>2</option></select></div><div><label>내 좌석</label><select class="field" id="heroSeat"></select></div><div><label>버튼 좌석</label><select class="field" id="dealerSeat"></select></div></div><div id="seatButtons" class="seats"></div><div class="line" style="margin-top:8px"><div><span class="muted">현재 차례 </span><span class="current" id="actorText"></span></div><div><span class="muted">스트리트 </span><strong id="streetText">프리플랍</strong></div></div><div class="status" id="turnStatus"></div><div class="twocol"><div><label>콜 필요액 (현재 좌석)</label><input class="field" id="call" type="number" min="0" value="0"></div><div><label>상대 수 (코칭용)</label><select class="field" id="opps"><option value="1">1명</option><option value="2">2명</option><option value="3">3명</option><option value="4">4명 이상</option></select></div></div><div class="streetBtns"><button id="nextStreet" class="primary">다음 스트리트</button><button id="turnUndo">액션 취소</button><button id="nextHand">다음 핸드</button><button id="tableReset">테이블 초기화</button></div></div>

<div class="hidden"><div id="bets"></div></div><div class="footer">실전용 한 화면 UI · 베팅액과 팟은 입력한 액션만 반영됩니다. 코칭은 근사 규칙이며 정확한 승률 계산이나 솔버가 아닙니다. 실시간 코칭이 금지된 곳에서는 복기용으로 사용하세요. <a href="./ai-live.html">전체 코칭기</a></div>
<div class="sheet" id="sheet"><div class="sheetbody"><div class="line"><strong id="pickTitle">카드 선택</strong><button id="close">닫기</button></div><p class="muted">랭크 → 무늬 순서로 터치</p><div class="ranks" id="ranks"></div><div class="suits" id="suits" style="margin-top:10px"></div></div></div>
<script>
const $=x=>document.getElementById(x),fmt=n=>Math.round(n).toLocaleString('ko-KR'),num=x=>Math.max(0,Number($(x).value)||0);
let pot=300,draft=0,history=[],hero=[],board=[],mode='hero',rank='A';
const rankOrder='23456789TJQKA',suitSymbols={S:'♠',H:'♥',D:'♦',C:'♣'};
function draw(){ $('pot').textContent=fmt(pot);$('draft').textContent=fmt(draft);$('heroCards').innerHTML=hero.map(cardHtml).join('')||'<span class="muted">카드를 선택하세요</span>';$('boardCards').innerHTML=board.map(cardHtml).join('')||'<span class="muted">보드 없음</span>'; coach();}
function cardHtml(c){return '<span class="card '+('HD'.includes(c[1])?'red':'')+'">'+(c[0]==='T'?'10':c[0])+suitSymbols[c[1]]+'</span>'}
[100,500,1000,5000,10000,25000,50000].forEach(v=>{let b=document.createElement('button');b.textContent='+'+fmt(v);b.onclick=()=>{draft+=v;draw()};$('chips').appendChild(b)});
$('add').onclick=()=>{if(!draft)return;history.push(pot);pot+=draft;draft=0;draw()};
$('undo').onclick=()=>{if(history.length){pot=history.pop();draw()}};
$('clear').onclick=()=>{draft=0;draw()};
$('adjust').onclick=()=>{const v=prompt('현재 팟 금액을 입력하세요',pot);if(v!==null&&Number.isFinite(Number(v))&&Number(v)>=0){history.push(pot);pot=Number(v);draw()}};
function reset(){if(!confirm('새 핸드를 시작할까요? 카드·보드·팟·콜 금액이 초기화됩니다.'))return;pot=num('sb')+num('bb')+num('ante');draft=0;history=[];hero=[];board=[];$('call').value=0;draw()}
$('reset').onclick=reset;
['sb','bb','ante','stack','pos','style','call','opps'].forEach(id=>$(id).addEventListener('input',coach));
const betOptions=[200,400,600,1000,1500,2000,3000,5000,10000,20000];
betOptions.forEach(v=>{let b=document.createElement('button');b.textContent=fmt(v);b.onclick=()=>{$('call').value=v;coach()};$('bets').appendChild(b)});
const custom=document.createElement('button');custom.textContent='직접 입력';custom.onclick=()=>{$('call').focus();$('call').select()};$('bets').appendChild(custom);
$('heroBtn').onclick=()=>openPick('hero');$('boardBtn').onclick=()=>openPick('board');$('flop').onclick=()=>openPick('board');$('turn').onclick=()=>openPick('board');$('river').onclick=()=>openPick('board');$('boardClear').onclick=()=>{board=[];draw()};
function openPick(m){mode=m;$('pickTitle').textContent=m==='hero'?'내 카드 선택':'보드 카드 선택';$('sheet').classList.add('open')}
$('close').onclick=()=>$('sheet').classList.remove('open');
'AKQJT98765432'.split('').forEach(r=>{let b=document.createElement('button');b.textContent=r==='T'?'10':r;b.onclick=()=>{rank=r;renderRanks()};$('ranks').appendChild(b)});
function renderRanks(){Array.from($('ranks').children).forEach((b,i)=>b.classList.toggle('on','AKQJT98765432'[i]===rank))}
Object.entries(suitSymbols).forEach(([s,sym])=>{let b=document.createElement('button');b.textContent=sym;b.style.color='HD'.includes(s)?'#ff8b9d':'white';b.onclick=()=>{let c=rank+s;if([...hero,...board].includes(c))return alert('이미 선택한 카드입니다');let arr=mode==='hero'?hero:board;if(arr.length>=(mode==='hero'?2:5))return alert('카드 수가 가득 찼습니다');arr.push(c);if(mode==='hero'&&hero.length===2||mode==='board'&&board.length===5)$('sheet').classList.remove('open');draw()};$('suits').appendChild(b)});renderRanks();
function evaluate(cards){if(cards.length<5)return null;let best=null;const n=cards.length;for(let a=0;a<n-4;a++)for(let b=a+1;b<n-3;b++)for(let c=b+1;c<n-2;c++)for(let d=c+1;d<n-1;d++)for(let e=d+1;e<n;e++){const hand=[cards[a],cards[b],cards[c],cards[d],cards[e]],vals=hand.map(x=>rankOrder.indexOf(x[0])+2),counts={};vals.forEach(v=>counts[v]=(counts[v]||0)+1);let groups=Object.entries(counts).map(([v,k])=>[+k,+v]).sort((x,y)=>y[0]-x[0]||y[1]-x[1]),flush=hand.every(x=>x[1]===hand[0][1]),uniq=[...new Set(vals)].sort((x,y)=>y-x);if(uniq.includes(14))uniq.push(1);let straight=0;for(let i=0;i<=uniq.length-5;i++)if(uniq[i]-uniq[i+4]===4){straight=uniq[i];break}let score;if(flush&&straight)score=[8,straight];else if(groups[0][0]===4)score=[7,groups[0][1],groups[1][1]];else if(groups[0][0]===3&&groups[1][0]===2)score=[6,groups[0][1],groups[1][1]];else if(flush)score=[5,...vals.sort((x,y)=>y-x)];else if(straight)score=[4,straight];else if(groups[0][0]===3)score=[3,groups[0][1],...groups.slice(1).map(x=>x[1]).sort((x,y)=>y-x)];else if(groups[0][0]===2&&groups[1][0]===2)score=[2,Math.max(groups[0][1],groups[1][1]),Math.min(groups[0][1],groups[1][1]),groups[2][1]];else if(groups[0][0]===2)score=[1,groups[0][1],...groups.slice(1).map(x=>x[1]).sort((x,y)=>y-x)];else score=[0,...vals.sort((x,y)=>y-x)];if(!best||compare(score,best)>0)best=score}return best}
function compare(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){let diff=(a[i]||0)-(b[i]||0);if(diff)return diff}return 0}
const names=['하이카드','원페어','투페어','트리플','스트레이트','플러시','풀하우스','포카드','스트레이트 플러시'];
function coach(){if(hero.length!==2){$('recommend').textContent='내 카드 2장을 선택하세요';$('details').textContent='';return}
let call=num('call'),stack=num('stack'),bb=Math.max(1,num('bb')),opps=Number($('opps').value),pos=$('pos').value,style=$('style').value;
let required=call/(pot+call)*100,eff=stack/bb,rank1=rankOrder.indexOf(hero[0][0])+2,rank2=rankOrder.indexOf(hero[1][0])+2,hi=Math.max(rank1,rank2),lo=Math.min(rank1,rank2),pair=hi===lo,suited=hero[0][1]===hero[1][1],gap=hi-lo;
let score=evaluate([...hero,...board]),boardScore=board.length===5?evaluate(board):null,shared=score&&boardScore&&compare(score,boardScore)===0;
let made=score?names[score[0]]:'프리플랍',draws=[];
if(board.length===3||board.length===4){let suits={};[...hero,...board].forEach(c=>suits[c[1]]=(suits[c[1]]||0)+1);if(Object.values(suits).some(n=>n===4)&&hero.some(c=>suits[c[1]]===4))draws.push('플러시 드로우');let uniq=[...new Set([...hero,...board].map(c=>rankOrder.indexOf(c[0])+2))];if(uniq.includes(14))uniq.push(1);for(let start=1;start<=10;start++){let hits=0;for(let v=start;v<start+5;v++)if(uniq.includes(v))hits++;if(hits===4){draws.push('스트레이트 드로우 가능');break}}}
let rec='',reason='';
if(board.length<3){let power=(pair?hi*3+14:hi*1.5+lo*.6)+(suited?4:0)+(gap===1?3:gap===2?1:0);let strong=pair&&hi>=10||hi===14&&lo>=12||hi===14&&lo>=10&&suited;
if(call===0){rec=strong||power>=27?'레이즈 후보':'체크 / 상황에 따라 오픈';reason='포지션과 선행 액션에 따라 오픈 레인지가 달라집니다.'}
else if(strong&&eff<=20){rec='레이즈 / 올인 검토';reason='강한 프리플랍 핸드와 유효 스택을 고려하세요.'}
else if(strong){rec='콜 또는 3벳 검토';reason='상대 오픈 레인지와 포지션 확인이 필요합니다.'}
else if((pair&&hi>=7||hi>=12&&lo>=10||suited&&hi>=11&&lo>=9)&&required<27&&opps<=2){rec='콜 후보';reason='팟오즈는 유리할 수 있으나 상대 레인지가 중요합니다.'}
else{rec=call>0?'폴드 우선':'체크';reason='불리한 핸드·가격일 가능성이 있습니다.'}}
else if(call===0){if(score[0]>=2&&!shared){rec='밸류 베팅 검토';reason='메이드 핸드가 있지만 보드 위험과 상대 범위를 확인하세요.'}else if(score[0]===1&&!shared&&opps===1){rec='소액 밸류 / 체크';reason='원페어 강도와 키커에 따라 달라집니다.'}else{rec='체크 우선';reason='무료 카드 및 쇼다운 가치 보존.'}}
else if(score[0]>=4&&!shared){rec='콜 / 레이즈 검토';reason='강한 족보지만 보드 공유 강패와 상위 족보 가능성 확인.'}
else if(score[0]>=2&&!shared&&required<30&&opps<=2){rec='콜 후보';reason='상대 밸류 범위와 드로우 완성 여부 확인.'}
else if(draws.length&&board.length<5&&required<=(draws.includes('플러시 드로우')?20:12)){rec='콜 후보';reason='드로우 확률과 추가 베팅 가능성은 별도 검토.'}
else{rec='폴드 / 상대 확인';reason='핸드 강도와 현재 콜 가격만으로 확정 판단할 수 없습니다.'}
if(style==='tight'&&call>0)reason+=' 타이트 상대의 강한 베팅은 더 보수적으로 보세요.';
